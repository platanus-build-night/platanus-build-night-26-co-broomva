<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="keel-icon-title">
  <title id="keel-icon-title">Keel</title>
  <!--
    Square tile: social preview, OG image, app icon, submission logo. The one
    brand asset that carries its own canvas, because the surfaces that consume
    it composite onto backgrounds Keel does not control.

    No paper variant. A tile is a filled object rather than an ink drawing, and
    the contexts that use one (OG cards, avatars, GitHub social preview) render
    it against their own chrome in both themes without asking. Shipping a white
    tile as well would just be two things to keep in step for no gain.

    The mark sits at 64% of the tile width, which is the standard optical inset
    for an icon that will be masked to a rounded square by an OS it cannot see.
  -->
  <style>
    .keel-canvas { fill: #07090c }
    .keel-block { fill: #e8edf2 }
    .keel-outside { fill: #7dd3fc }
  </style>

  <rect class="keel-canvas" width="512" height="512"/>

  <g transform="translate(92 151) scale(3.28)">
    <g class="keel-block">
      <rect x="0"  y="0"  width="18" height="18" rx="3"/>
      <rect x="23" y="0"  width="18" height="18" rx="3"/>
      <rect x="46" y="0"  width="18" height="18" rx="3"/>
      <rect x="0"  y="23" width="18" height="18" rx="3"/>
      <rect x="23" y="23" width="18" height="18" rx="3"/>
      <rect x="46" y="23" width="18" height="18" rx="3"/>
      <rect x="0"  y="46" width="18" height="18" rx="3"/>
      <rect x="23" y="46" width="18" height="18" rx="3"/>
      <rect x="46" y="46" width="18" height="18" rx="3"/>
    </g>
    <rect class="keel-outside" x="82" y="23" width="18" height="18" rx="3"/>
  </g>
</svg>
