<!-- GENERATED by `make design-sync` from lockup.svg. Do not edit.
     Paper variant: for light backgrounds (README light mode, print,
     slides). Geometry is identical; only the two ink values change. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64" role="img" aria-labelledby="keel-lockup-title">
  <title id="keel-lockup-title">Keel</title>
  <!--
    The horizontal lockup: mark + wordmark. Use in the README header, the site
    nav, and anywhere the mark alone would not identify the project.

    Clear space is one cell (18 units at this scale) on every side. The gap
    between mark and wordmark is 28 — wider than clear space, so the two never
    read as one object.

    The wordmark is set in the design system's sans stack, which means it
    renders slightly differently per platform. That is the same trade the whole
    system already makes: the no-webfonts invariant comes from the report's
    zero-external-request requirement, and a lockup that reached for a hosted
    face would be the one asset breaking the rule everything else obeys.
    `textLength` pins the advance width so the lockup's overall proportions
    stay fixed even as the glyphs shift.
  -->
  <!-- Colors are literal: a standalone SVG loaded via <img> cannot see the
       document's custom properties. They are exactly the tokens in tokens.css
       and `make design-audit` fails if they drift.

       There is no prefers-color-scheme block here on purpose. Inside an
       <img>-loaded SVG that query follows the OS setting, not the background
       the mark is actually sitting on — so on a light-mode machine it would
       flip to paper ink while the Keel canvas underneath stayed near-black,
       and the mark would disappear. The paper variant is a separate file,
       derived from this one by `make design-sync`. -->
  <style>
    .keel-block { fill: #14161a }
    .keel-outside { fill: #0b6ea8 }
    .keel-word {
      fill: #14161a;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      font-size: 42px;
      font-weight: 500;
    }
  </style>

  <g class="keel-block">
