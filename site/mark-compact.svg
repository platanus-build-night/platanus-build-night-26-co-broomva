<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="keel-compact-title">
  <title id="keel-compact-title">Keel</title>
  <!--
    The Keel mark, reduced. Use below 24px — favicon, tab icon, avatar.

    A mark that reduces by scaling alone mushes: at 16px the primary mark's
    3x3 block becomes an undifferentiated smear and the composition stops
    reading. This is a redraw, not a scale. It drops to a 2x2 block so the
    cells stay fat enough to resolve, and keeps the proportional logic of the
    primary exactly — internal gap is 0.28 of a cell, and the block-to-outsider
    gap is one full cell width.

    Tested at 16 / 20 / 32 / 64. A solid block was the alternative and reads
    fine at 16px, but it loses the ledger and degenerates into a generic
    square-and-dot. This keeps the argument intact at every size that ships.
  -->
  <!-- Colors are literal: a standalone SVG loaded via <img> cannot see the
       document's custom properties. They are exactly the tokens in tokens.css
       and `make design-audit` fails if they drift.

       There is no prefers-color-scheme block here on purpose. Inside an
       <img>-loaded SVG that query follows the OS setting, not the background
       the mark is actually sitting on — so on a light-mode machine it would
       flip to paper ink while the Keel canvas underneath stayed near-black,
       and the mark would disappear. The paper variant is a separate file,
       derived from this one by `make design-sync`. -->
  <style>
    .keel-block { fill: #e8edf2 }
    .keel-outside { fill: #7dd3fc }
  </style>

  <g class="keel-block">
    <rect x="2"  y="16" width="14" height="14" rx="2.5"/>
    <rect x="20" y="16" width="14" height="14" rx="2.5"/>
    <rect x="2"  y="34" width="14" height="14" rx="2.5"/>
    <rect x="20" y="34" width="14" height="14" rx="2.5"/>
  </g>

  <rect class="keel-outside" x="48" y="25" width="14" height="14" rx="2.5"/>
</svg>
