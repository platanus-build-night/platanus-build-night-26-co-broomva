<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#07090c"/>

  <!-- waterline: the surface. everything visible from above. -->
  <g stroke="#39434f" stroke-width="12" stroke-linecap="round">
    <line x1="140" y1="355" x2="258" y2="355"/>
    <line x1="742" y1="355" x2="860" y2="355"/>
  </g>

  <!-- hull section: flared topsides, riding the surface -->
  <path d="M 250 285 C 300 515, 700 515, 750 285"
        fill="none" stroke="#e8edf2" stroke-width="30" stroke-linecap="round"/>

  <!-- keel: the reference line. it descends past the surface into what the
       vessel cannot author. the part that does the work is the part you
       cannot see from above. -->
  <line x1="500" y1="452" x2="500" y2="690"
        stroke="#7dd3fc" stroke-width="30" stroke-linecap="round"/>

  <!-- datum: where the measurement lands -->
  <line x1="435" y1="722" x2="565" y2="722"
        stroke="#7dd3fc" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
</svg>
